<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Анатомический Симулятор Сердца</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel compiler for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #020617;
      color: #f8fafc;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- TISSUE TYPES DEFINITION WITH COLORS & DESCRIPTIONS ---
    const TISSUE_TYPES = {
      ENDOCARDIUM: {
        id: 'ENDOCARDIUM',
        name: 'Эндокард (Endocardium)',
        shortName: 'Эндокард',
        colorName: 'Голубой / Лазурный',
        color: '#38bdf8',
        meshColor: 0x38bdf8,
        roughness: 0.05,
        icon: '💧',
        desc: 'Гладкая внутренняя выстилка камер'
      },
      MYOCARDIUM: {
        id: 'MYOCARDIUM',
        name: 'Миокард (Myocardium)',
        shortName: 'Миокард',
        colorName: 'Темно-красный / Рубиновый',
        color: '#ef4444',
        meshColor: 0xa81c1c,
        roughness: 0.6,
        icon: '💪',
        desc: 'Сократительный мышечный слой'
      },
      EPICARDIUM: {
        id: 'EPICARDIUM',
        name: 'Эпикард (Epicardium)',
        shortName: 'Эпикард',
        colorName: 'Оранжевый / Янтарный',
        color: '#f59e0b',
        meshColor: 0xdd6b20,
        roughness: 0.3,
        icon: '🩺',
        desc: 'Внешняя серозная оболочка'
      },
      PERICARDIUM: {
        id: 'PERICARDIUM',
        name: 'Перикард (Fibrous Pericardium)',
        shortName: 'Перикард',
        colorName: 'Фиолетовый / Пурпурный',
        color: '#a855f7',
        meshColor: 0x8b5cf6,
        roughness: 0.85,
        icon: '🔒',
        desc: 'Плотная защитная фиброзная сумка'
      },
      FIBROUS_SKELETON: {
        id: 'FIBROUS_SKELETON',
        name: 'Фиброзный скелет и Клапаны',
        shortName: 'Клапанный аппарат',
        colorName: 'Розовый',
        color: '#ec4899',
        meshColor: 0xf472b6,
        roughness: 0.2,
        icon: '⚙️',
        desc: 'Клапанный каркас сердцебиения'
      },
      CORONARY_VESSELS: {
        id: 'CORONARY_VESSELS',
        name: 'Коронарные артерии',
        shortName: 'Коронарные сосуды',
        colorName: 'Изумрудно-зеленый',
        color: '#10b981',
        meshColor: 0x10b981,
        roughness: 0.2,
        icon: '🩸',
        desc: 'Сосуды питания мышцы сердца'
      }
    };

    const PRESETS = {
      CORRECT: {
        name: 'Анатомический эталон',
        layers: [
          TISSUE_TYPES.ENDOCARDIUM,
          TISSUE_TYPES.FIBROUS_SKELETON,
          TISSUE_TYPES.MYOCARDIUM,
          TISSUE_TYPES.CORONARY_VESSELS,
          TISSUE_TYPES.EPICARDIUM,
          TISSUE_TYPES.PERICARDIUM
        ],
        purkinje: 'INNER'
      },
      INVERTED: {
        name: 'Инверсия слоев',
        layers: [
          TISSUE_TYPES.PERICARDIUM,
          TISSUE_TYPES.MYOCARDIUM,
          TISSUE_TYPES.ENDOCARDIUM
        ],
        purkinje: 'OUTSIDE'
      },
      ASYSTOLE: {
        name: 'Блокада проведения',
        layers: [
          TISSUE_TYPES.ENDOCARDIUM,
          TISSUE_TYPES.MYOCARDIUM,
          TISSUE_TYPES.EPICARDIUM,
          TISSUE_TYPES.PERICARDIUM
        ],
        purkinje: 'NONE'
      }
    };

    function App() {
      const [layers, setLayers] = useState(PRESETS.CORRECT.layers);
      const [purkinjePosition, setPurkinjePosition] = useState('INNER');
      const [isRunning, setIsRunning] = useState(true);
      const [isCrossSection, setIsCrossSection] = useState(true);

      const [simMetrics, setSimMetrics] = useState({
        strokeVolume: 70,
        cardiacOutput: 5.0,
        systolicPressure: 120,
        thrombosisRisk: 0,
        asystole: false
      });

      const [complications, setComplications] = useState([]);

      const canvasRef = useRef(null);

      // --- COMPLICATION & HEMODYNAMIC DIAGNOSIS LOGIC ---
      useEffect(() => {
        const innermost = layers[0];
        
        const myocardiumCount = layers.filter(l => l && l.id === 'MYOCARDIUM').length;
        const myocardiumIdx = layers.findIndex(l => l && l.id === 'MYOCARDIUM');
        const endocardiumCount = layers.filter(l => l && l.id === 'ENDOCARDIUM').length;
        const pericardiumIdx = layers.findIndex(l => l && l.id === 'PERICARDIUM');
        const coronariesCount = layers.filter(l => l && l.id === 'CORONARY_VESSELS').length;
        const valvesPresent = layers.some(l => l && l.id === 'FIBROUS_SKELETON');

        const detectedComplications = [];

        // 1. Thrombosis Risk Analysis
        let thrombosis = 0;
        if (innermost && innermost.id !== 'ENDOCARDIUM') {
          thrombosis = Math.min(100, Math.round((innermost.roughness || 0.5) * 120));
          detectedComplications.push({
            type: 'CRITICAL',
            title: 'Массивное тромбообразование',
            desc: `Внутренний слой — "${innermost.shortName}". Из-за высокой шероховатости поверхности кровь свертывается внутри камеры.`
          });
        }

        // 2. Endocardium Absence or Misplacement
        if (endocardiumCount === 0) {
          detectedComplications.push({
            type: 'WARNING',
            title: 'Отсутствие эндокарда',
            desc: 'Отсутствует гладкая эндотелиальная выстилка. Повышен риск тромбоэмболии и разрушения форменных элементов крови.'
          });
        } else if (layers.some((l, i) => l.id === 'ENDOCARDIUM' && i > 2)) {
          detectedComplications.push({
            type: 'INFO',
            title: 'Апикальное смещение эндокарда',
            desc: 'Эндокард находится во внешних слоях, где он теряет свою главную функцию снижения трения крови.'
          });
        }

        // 3. Myocardium Duplication, Absence & Mechanical Vector
        let asystole = myocardiumCount === 0 || purkinjePosition === 'NONE';
        let force = asystole ? 0 : 1.0;

        if (myocardiumCount === 0) {
          detectedComplications.push({
            type: 'CRITICAL',
            title: 'Асистолия (Агенезия миокарда)',
            desc: 'Отсутствует мышечный слой. Сердце превратилось в пассивный мешок, сокращение невозможно.'
          });
        } else if (myocardiumCount > 2) {
          force *= 0.6; // Hypertrophic rigidity
          detectedComplications.push({
            type: 'WARNING',
            title: 'Гипертрофическая ригидность',
            desc: `Избыток миокарда (${myocardiumCount} слоев) резко снижает диастолическое наполнение. Камера не может расшириться.`
          });
        }

        // Paradoxical Dilation (Myocardium on outside)
        if (myocardiumIdx === layers.length - 1 && layers.length > 1) {
          detectedComplications.push({
            type: 'CRITICAL',
            title: 'Парадоксальная дилатация',
            desc: 'Миокард находится на самом внешнем контуре. При сокращении он растягивает внутренние слои вместо сжатия!'
          });
        }

        // 4. Intracardiac Stenosis (Pericardium placed inside)
        if (pericardiumIdx === 0) {
          force *= 0.2;
          detectedComplications.push({
            type: 'CRITICAL',
            title: 'Внутрисердечный стеноз / Обструкция',
            desc: 'Жесткая фиброзная сумка перикарда расположена внутри камеры. Наполнение сердца заблокировано.'
          });
        }

        // 5. Coronary Ischemia / Overload
        if (coronariesCount === 0 && myocardiumCount > 0) {
          force *= 0.5;
          detectedComplications.push({
            type: 'WARNING',
            title: 'Ишемия и некроз миокарда',
            desc: 'Отсутствуют коронарные артерии. Мышца сердца испытывает гипоксию, сила сокращений упала на 50%.'
          });
        } else if (coronariesCount > 2) {
          detectedComplications.push({
            type: 'INFO',
            title: 'Избыточная васкуляризация',
            desc: 'Множественное дублирование сосудов создает коронарный синдром обкрадывания.'
          });
        }

        // 6. Valve Regurgitation
        if (!valvesPresent) {
          force *= 0.7;
          detectedComplications.push({
            type: 'WARNING',
            title: 'Тяжелая регургитация',
            desc: 'Отсутствует клапанный аппарат. Происходит обратный ток крови во время систолы.'
          });
        }

        // Calculate derived Hemodynamics
        const strokeVol = Math.max(0, Math.round(75 * Math.abs(force)));
        const cardiacOut = parseFloat(((strokeVol * 72) / 1000).toFixed(1));

        setSimMetrics({
          strokeVolume: strokeVol,
          cardiacOutput: cardiacOut,
          systolicPressure: Math.max(10, Math.round(120 * Math.abs(force))),
          thrombosisRisk: thrombosis,
          asystole: asystole
        });

        setComplications(detectedComplications);
      }, [layers, purkinjePosition]);

      // Advanced Anatomical 3D Scene Initialization
      useEffect(() => {
        if (!canvasRef.current) return;

        const width = canvasRef.current.clientWidth;
        const height = canvasRef.current.clientHeight;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020617);

        const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 1000);
        camera.position.set(0, 0.5, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(width, height);
        renderer.shadowMap.enabled = true;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.1;

        canvasRef.current.innerHTML = '';
        canvasRef.current.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xfff0ed, 0.6);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 1.6);
        mainLight.position.set(8, 12, 10);
        mainLight.castShadow = true;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0x38bdf8, 0.7);
        fillLight.position.set(-10, -5, -6);
        scene.add(fillLight);

        const backLight = new THREE.DirectionalLight(0xef4444, 0.9);
        backLight.position.set(0, -8, -8);
        scene.add(backLight);

        const heartGroup = new THREE.Group();
        scene.add(heartGroup);

        // --- HIGH-DETAIL ANATOMICAL HEART MODEL BUILDER ---
        const buildAnatomicalHeartModel = () => {
          const root = new THREE.Group();

          const muscleMaterial = new THREE.MeshStandardMaterial({
            color: 0x9e1b1b,
            roughness: 0.45,
            metalness: 0.05,
            side: THREE.DoubleSide
          });

          const cutSectionMaterial = new THREE.MeshStandardMaterial({
            color: 0xd94848,
            roughness: 0.35,
            metalness: 0.05,
            side: THREE.DoubleSide
          });

          const innerChamberMaterial = new THREE.MeshStandardMaterial({
            color: 0x610a0a,
            roughness: 0.6,
            side: THREE.DoubleSide
          });

          const vesselRed = new THREE.MeshStandardMaterial({ color: 0xc42525, roughness: 0.25, metalness: 0.1 });
          const vesselBlue = new THREE.MeshStandardMaterial({ color: 0x1d4ed8, roughness: 0.3 });
          const fatMaterial = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.7 });
          const valveMaterial = new THREE.MeshStandardMaterial({ color: 0xfce7f3, transparent: true, opacity: 0.85, side: THREE.DoubleSide });

          // 1. VENTRICULAR OUTER WALL & CROSS-SECTION CUT
          const outerGeo = new THREE.SphereGeometry(2.4, 64, 64, 0, Math.PI * (isCrossSection ? 1.5 : 2.0));
          const pos = outerGeo.attributes.position;

          for (let i = 0; i < pos.count; i++) {
            let x = pos.getX(i);
            let y = pos.getY(i);
            let z = pos.getZ(i);

            if (y < 0) {
              let factor = 1 + y * 0.24;
              x *= Math.max(0.08, factor);
              z *= Math.max(0.08, factor);
            }
            if (x < 0) x *= 1.35;
            if (z > 0 && Math.abs(x) < 0.5) z -= 0.2;

            pos.setXYZ(i, x, y, z);
          }
          outerGeo.computeVertexNormals();

          // Render Layer Stack
          layers.forEach((layer, idx) => {
            if (!layer) return;
            const scale = 1.0 + idx * 0.12;
            const geo = outerGeo.clone();
            geo.scale(scale, scale, scale);

            const mat = new THREE.MeshStandardMaterial({
              color: layer.meshColor,
              roughness: layer.roughness,
              metalness: 0.08,
              transparent: true,
              opacity: isCrossSection && idx > 1 ? 0.75 : 0.95,
              side: THREE.DoubleSide
            });

            const mesh = new THREE.Mesh(geo, mat);
            mesh.rotation.z = -0.22;
            root.add(mesh);
          });

          // 2. INTERNAL ANATOMY
          if (isCrossSection) {
            const septumGeo = new THREE.BoxGeometry(0.5, 3.4, 2.2);
            const septumMesh = new THREE.Mesh(septumGeo, cutSectionMaterial);
            septumMesh.position.set(-0.1, -0.3, 0.2);
            septumMesh.rotation.z = -0.2;
            root.add(septumMesh);

            const lvWallGeo = new THREE.CylinderGeometry(1.6, 0.4, 3.2, 32, 1, true, 0, Math.PI * 0.8);
            const lvWall = new THREE.Mesh(lvWallGeo, cutSectionMaterial);
            lvWall.position.set(-0.8, -0.3, 0.1);
            lvWall.rotation.z = -0.22;
            root.add(lvWall);

            const trabeculaeGroup = new THREE.Group();
            for (let t = 0; t < 12; t++) {
              const ridgeGeo = new THREE.TorusGeometry(0.4 + Math.random() * 0.3, 0.08, 8, 16);
              const ridge = new THREE.Mesh(ridgeGeo, innerChamberMaterial);
              ridge.position.set(-0.8 + (Math.random() - 0.5) * 0.8, -1.0 + Math.random() * 1.5, 0.2 + Math.random() * 0.6);
              ridge.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, 0);
              trabeculaeGroup.add(ridge);
            }
            root.add(trabeculaeGroup);

            const pap1 = new THREE.Mesh(new THREE.ConeGeometry(0.3, 1.1, 16), innerChamberMaterial);
            pap1.position.set(-1.1, -1.1, 0.5);
            pap1.rotation.z = 0.3;
            root.add(pap1);

            const pap2 = new THREE.Mesh(new THREE.ConeGeometry(0.25, 0.9, 16), innerChamberMaterial);
            pap2.position.set(0.6, -1.0, 0.4);
            pap2.rotation.z = -0.3;
            root.add(pap2);

            for (let c = 0; c < 6; c++) {
              const threadCurve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(-1.0, -0.6, 0.5),
                new THREE.Vector3(-0.9 + c * 0.08, 0.6, 0.4)
              ]);
              const threadGeo = new THREE.TubeGeometry(threadCurve, 8, 0.02, 6, false);
              const threadMesh = new THREE.Mesh(threadGeo, valveMaterial);
              root.add(threadMesh);
            }

            const valveFlap1 = new THREE.Mesh(new THREE.ConeGeometry(0.8, 0.4, 16, 1, true), valveMaterial);
            valveFlap1.position.set(-0.9, 0.8, 0.3);
            valveFlap1.rotation.x = Math.PI;
            root.add(valveFlap1);

            const valveFlap2 = new THREE.Mesh(new THREE.ConeGeometry(0.7, 0.4, 16, 1, true), valveMaterial);
            valveFlap2.position.set(0.7, 0.8, 0.3);
            valveFlap2.rotation.x = Math.PI;
            root.add(valveFlap2);
          }

          // 3. ATRIA
          const leftAtrium = new THREE.Mesh(new THREE.DodecahedronGeometry(1.2, 3), muscleMaterial);
          leftAtrium.position.set(-1.3, 2.1, -0.3);
          leftAtrium.scale.set(1.2, 0.9, 1.0);
          root.add(leftAtrium);

          const rightAtrium = new THREE.Mesh(new THREE.DodecahedronGeometry(1.1, 3), muscleMaterial);
          rightAtrium.position.set(1.3, 2.0, 0.3);
          rightAtrium.scale.set(1.1, 0.85, 0.95);
          root.add(rightAtrium);

          // 4. MAJOR VASCULAR OUTFLOWS
          const aortaCurve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(-0.2, 1.5, 0.2),
            new THREE.Vector3(-0.1, 3.8, 0.1),
            new THREE.Vector3(0.8, 4.7, -0.4),
            new THREE.Vector3(1.5, 3.8, -0.9),
            new THREE.Vector3(1.6, 1.6, -1.2)
          ]);
          const aortaGeo = new THREE.TubeGeometry(aortaCurve, 40, 0.46, 20, false);
          root.add(new THREE.Mesh(aortaGeo, vesselRed));

          [0.38, 0.52, 0.66].forEach(t => {
            const pt = aortaCurve.getPoint(t);
            const branchCurve = new THREE.CatmullRomCurve3([
              pt,
              new THREE.Vector3(pt.x + (Math.random() - 0.5) * 0.1, pt.y + 1.0, pt.z + (Math.random() - 0.5) * 0.1)
            ]);
            root.add(new THREE.Mesh(new THREE.TubeGeometry(branchCurve, 10, 0.12, 8, false), vesselRed));
          });

          const pulmCurve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(0.4, 1.4, 0.6),
            new THREE.Vector3(-0.7, 3.2, 0.4),
            new THREE.Vector3(-1.8, 3.6, -0.2)
          ]);
          root.add(new THREE.Mesh(new THREE.TubeGeometry(pulmCurve, 30, 0.4, 16, false), vesselBlue));

          const cavaCurve = new THREE.CatmullRomCurve3([
            new THREE.Vector3(1.9, -0.4, -0.2),
            new THREE.Vector3(1.9, 3.8, -0.2)
          ]);
          root.add(new THREE.Mesh(new THREE.TubeGeometry(cavaCurve, 20, 0.36, 16, false), vesselBlue));

          // 5. DETAILED CORONARY VESSEL NETWORK
          const createCoronaryBranch = (points, radius, isArtery = true) => {
            const curve = new THREE.CatmullRomCurve3(points);
            const geo = new THREE.TubeGeometry(curve, 30, radius, 8, false);
            return new THREE.Mesh(geo, isArtery ? vesselRed : vesselBlue);
          };

          root.add(createCoronaryBranch([
            new THREE.Vector3(-0.2, 1.6, 1.3),
            new THREE.Vector3(-0.5, 0.4, 2.0),
            new THREE.Vector3(-0.7, -1.0, 1.6),
            new THREE.Vector3(-0.3, -2.4, 0.6)
          ], 0.08, true));

          root.add(createCoronaryBranch([
            new THREE.Vector3(0.9, 1.6, 1.0),
            new THREE.Vector3(1.5, 0.6, 1.3),
            new THREE.Vector3(1.3, -0.8, 1.1),
            new THREE.Vector3(0.6, -2.0, 0.7)
          ], 0.07, true));

          for (let f = 0; f < 8; f++) {
            const fatBlob = new THREE.Mesh(new THREE.DodecahedronGeometry(0.18, 1), fatMaterial);
            fatBlob.position.set(-0.4 + (Math.random() - 0.5) * 0.3, 1.0 - f * 0.4, 1.2 + Math.random() * 0.4);
            root.add(fatBlob);
          }

          return root;
        };

        const heartModel = buildAnatomicalHeartModel();
        heartGroup.add(heartModel);

        // Controls
        let isDragging = false;
        let prevMouse = { x: 0, y: 0 };

        const onMouseDown = (e) => {
          isDragging = true;
          prevMouse = { x: e.clientX, y: e.clientY };
        };

        const onMouseMove = (e) => {
          if (!isDragging) return;
          const deltaX = e.clientX - prevMouse.x;
          const deltaY = e.clientY - prevMouse.y;

          heartGroup.rotation.y += deltaX * 0.008;
          heartGroup.rotation.x += deltaY * 0.008;

          prevMouse = { x: e.clientX, y: e.clientY };
        };

        const onMouseUp = () => { isDragging = false; };

        const domElem = canvasRef.current;
        domElem.addEventListener('mousedown', onMouseDown);
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);

        let animationId;
        let clock = new THREE.Clock();

        const animate = () => {
          animationId = requestAnimationFrame(animate);
          const elapsed = clock.getElapsedTime();

          if (!isDragging) {
            heartGroup.rotation.y += 0.0025;
          }

          if (isRunning && !simMetrics.asystole) {
            const pulse = Math.sin(elapsed * 6);
            const scale = 1 - pulse * 0.04;
            heartModel.scale.set(scale, scale, scale);
          }

          renderer.render(scene, camera);
        };

        animate();

        return () => {
          cancelAnimationFrame(animationId);
          domElem.removeEventListener('mousedown', onMouseDown);
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mouseup', onMouseUp);
          renderer.dispose();
        };
      }, [layers, isCrossSection, isRunning, simMetrics]);

      // --- LAYER MANIPULATION HANDLERS ---
      const moveLayer = (index, dir) => {
        const updated = [...layers];
        const target = index + dir;
        if (target < 0 || target >= updated.length) return;
        const temp = updated[index];
        updated[index] = updated[target];
        updated[target] = temp;
        setLayers(updated);
      };

      const addLayer = (tissueKey) => {
        if (!TISSUE_TYPES[tissueKey]) return;
        setLayers([...layers, TISSUE_TYPES[tissueKey]]);
      };

      const removeLayer = (index) => {
        if (layers.length <= 1) return;
        setLayers(layers.filter((_, idx) => idx !== index));
      };

      return (
        <div className="flex flex-col h-screen w-screen bg-slate-950 text-slate-100 font-sans overflow-hidden">
          {/* Header */}
          <header className="h-14 border-b border-slate-800 bg-slate-900/80 px-6 flex items-center justify-between">
            <h1 className="text-sm font-bold uppercase tracking-wider text-slate-200">
              🫀 Анатомический 3D-Симулятор Сердца
            </h1>
            <div className="flex items-center gap-2">
              <button
                onClick={() => setIsRunning(!isRunning)}
                className="px-3 py-1.5 rounded text-xs font-semibold bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 hover:bg-emerald-500/30"
              >
                {isRunning ? 'Пауза' : 'Запустить'}
              </button>
              <button
                onClick={() => setIsCrossSection(!isCrossSection)}
                className="px-3 py-1.5 rounded text-xs font-semibold bg-cyan-500/20 text-cyan-300 border border-cyan-500/40"
              >
                {isCrossSection ? 'Полное сердце' : 'Анатомический срез'}
              </button>
            </div>
          </header>

          <div className="flex-1 grid grid-cols-12 overflow-hidden">
            {/* Left Column */}
            <div className="col-span-3 border-r border-slate-800 bg-slate-900/50 p-4 space-y-4 overflow-y-auto">
              <div>
                <h2 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Пресеты</h2>
                <div className="space-y-1">
                  {Object.keys(PRESETS).map(key => (
                    <button
                      key={key}
                      onClick={() => { setLayers(PRESETS[key].layers); setPurkinjePosition(PRESETS[key].purkinje); }}
                      className="w-full text-left p-2 rounded bg-slate-800/60 hover:bg-slate-700 text-xs font-medium text-slate-300 border border-slate-700/50"
                    >
                      {PRESETS[key].name}
                    </button>
                  ))}
                </div>
              </div>

              {/* Add Duplicate Layers Library */}
              <div className="pt-2 border-t border-slate-800">
                <h2 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">
                  Добавить слой (дубликаты)
                </h2>
                <div className="grid grid-cols-1 gap-1.5">
                  {Object.keys(TISSUE_TYPES).map(key => (
                    <button
                      key={key}
                      onClick={() => addLayer(key)}
                      className="p-1.5 rounded bg-slate-800/80 hover:bg-slate-700 text-left border border-slate-700/60 text-xs text-slate-200 flex items-center justify-between"
                    >
                      <span>{TISSUE_TYPES[key].icon} + {TISSUE_TYPES[key].shortName}</span>
                      <span className="w-2.5 h-2.5 rounded-full" style={{ backgroundColor: TISSUE_TYPES[key].color }} />
                    </button>
                  ))}
                </div>
              </div>

              {/* Active Layers Stack */}
              <div className="pt-2 border-t border-slate-800">
                <div className="flex justify-between items-center mb-2">
                  <h2 className="text-xs font-bold uppercase tracking-wider text-slate-400">
                    Текущие слои ({layers.length})
                  </h2>
                  <span className="text-[10px] text-slate-500">Изнутри ➔ Снаружи</span>
                </div>

                <div className="space-y-2">
                  {layers.map((layer, idx) => (
                    <div 
                      key={idx} 
                      className="p-2 rounded bg-slate-800 border border-slate-700 flex items-center justify-between text-xs"
                      style={{ borderLeftWidth: '4px', borderLeftColor: layer.color }}
                    >
                      <div className="flex items-center gap-1.5 min-w-0">
                        <span className="text-sm">{layer.icon}</span>
                        <div className="truncate">
                          <div className="font-semibold text-slate-200 truncate">{layer.shortName}</div>
                          <div className="text-[10px] text-slate-400">Цвет: {layer.colorName}</div>
                        </div>
                      </div>

                      <div className="flex items-center gap-1 shrink-0">
                        <button onClick={() => moveLayer(idx, -1)} disabled={idx === 0} className="px-1.5 py-0.5 bg-slate-700 rounded disabled:opacity-30">▲</button>
                        <button onClick={() => moveLayer(idx, 1)} disabled={idx === layers.length - 1} className="px-1.5 py-0.5 bg-slate-700 rounded disabled:opacity-30">▼</button>
                        <button 
                          onClick={() => removeLayer(idx)} 
                          disabled={layers.length <= 1}
                          className="px-1.5 py-0.5 bg-red-900/60 hover:bg-red-700 text-red-200 rounded disabled:opacity-30 font-bold"
                          title="Удалить этот слой"
                        >
                          ✕
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>

            {/* Middle - 3D Viewer */}
            <div className="col-span-6 relative bg-slate-950 flex flex-col">
              
              {/* COLOR LEGEND OVERLAY */}
              <div className="absolute top-4 left-4 right-4 bg-slate-900/90 backdrop-blur border border-slate-800 p-3 rounded-xl shadow-2xl z-10 pointer-events-none">
                <div className="text-[11px] font-bold uppercase tracking-wider text-cyan-400 mb-2">
                  🎨 Обозначение цветов анатомических слоев:
                </div>
                <div className="grid grid-cols-2 gap-2 text-xs">
                  {Object.values(TISSUE_TYPES).map(tissue => (
                    <div key={tissue.id} className="flex items-center gap-2 bg-slate-950/60 p-1.5 rounded border border-slate-800/80">
                      <span className="w-3.5 h-3.5 rounded-full shrink-0 shadow-sm" style={{ backgroundColor: tissue.color }} />
                      <div className="truncate">
                        <span className="font-semibold text-slate-200">{tissue.shortName}:</span>{' '}
                        <span className="text-slate-400 text-[11px]">{tissue.colorName}</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>

              <div ref={canvasRef} className="w-full h-full cursor-grab active:cursor-grabbing" />
              
              <div className="absolute bottom-4 left-4 text-[11px] text-slate-400 bg-slate-900/70 backdrop-blur px-3 py-1.5 rounded border border-slate-800">
                🖱️ Зажмите левую кнопку мыши для вращения 3D-модели
              </div>
            </div>

            {/* Right Column */}
            <div className="col-span-3 border-l border-slate-800 bg-slate-900/50 p-4 space-y-4 overflow-y-auto">
              
              {/* Hemodynamic Metrics */}
              <div>
                <h2 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Гемодинамика</h2>
                <div className="space-y-2 text-xs">
                  <div className="p-2.5 rounded bg-slate-800/60 border border-slate-700">
                    <div className="text-slate-400">Ударный объем</div>
                    <div className="text-base font-bold text-cyan-400">{simMetrics.strokeVolume} мл</div>
                  </div>
                  <div className="p-2.5 rounded bg-slate-800/60 border border-slate-700">
                    <div className="text-slate-400">Минутный объем (МОК)</div>
                    <div className="text-base font-bold text-emerald-400">{simMetrics.cardiacOutput} л/мин</div>
                  </div>
                  <div className="p-2.5 rounded bg-slate-800/60 border border-slate-700">
                    <div className="text-slate-400">Риск тромбообразования</div>
                    <div className={`text-base font-bold ${simMetrics.thrombosisRisk > 0 ? 'text-red-400' : 'text-emerald-400'}`}>
                      {simMetrics.thrombosisRisk}%
                    </div>
                  </div>
                </div>
              </div>

              {/* Pathological Complications */}
              <div className="pt-3 border-t border-slate-800">
                <h2 className="text-xs font-bold uppercase tracking-wider text-amber-400 mb-2 flex items-center gap-1">
                  ⚠️ Диагностика осложнений ({complications.length})
                </h2>

                {complications.length === 0 ? (
                  <div className="p-3 rounded bg-emerald-950/40 border border-emerald-500/30 text-emerald-300 text-xs">
                    ✅ <b>Нормальная анатомия.</b> Анатомический порядок слоев соблюден. Осложнений не выявлено.
                  </div>
                ) : (
                  <div className="space-y-2">
                    {complications.map((comp, cIdx) => (
                      <div 
                        key={cIdx} 
                        className={`p-2.5 rounded border text-xs space-y-1 ${
                          comp.type === 'CRITICAL' 
                            ? 'bg-red-950/50 border-red-500/50 text-red-200' 
                            : comp.type === 'WARNING'
                            ? 'bg-amber-950/50 border-amber-500/50 text-amber-200'
                            : 'bg-slate-800 border-slate-700 text-slate-300'
                        }`}
                      >
                        <div className="font-bold flex items-center justify-between">
                          <span>{comp.title}</span>
                          <span className="text-[10px] px-1.5 py-0.5 rounded uppercase font-mono bg-black/40">
                            {comp.type}
                          </span>
                        </div>
                        <p className="text-[11px] leading-relaxed opacity-90">{comp.desc}</p>
                      </div>
                    ))}
                  </div>
                )}
              </div>

            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
